<svg width="60" height="60" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer lens shape (two arcs meeting at left/right points) -->
  <path
    d="M 4 30 Q 30 3 56 30 Q 30 57 4 30 Z"
    stroke="#5db8e8"
    stroke-width="1.4"
    fill="none"
  />
  <!-- Inner ring -->
  <circle cx="30" cy="30" r="11"
    stroke="#5db8e8"
    stroke-width="1"
    stroke-opacity="0.45"
    fill="none"
  />
  <!-- Centre fill dot -->
  <circle cx="30" cy="30" r="4" fill="#5db8e8" />
  <!-- Subtle outer glow ring -->
  <circle cx="30" cy="30" r="22"
    stroke="#5db8e8"
    stroke-width="0.6"
    stroke-opacity="0.18"
    fill="none"
    stroke-dasharray="3 6"
  />
</svg>
